[project]
name = "learn-uv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.16.5",
    "boto3>=1.42.97",
    "pydantic-settings>=2.11.0",
]

[project.scripts]
start = "app.main:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
