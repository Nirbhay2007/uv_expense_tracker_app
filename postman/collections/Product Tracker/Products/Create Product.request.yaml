$kind: http-request
name: Create Product
method: POST
url: '{{baseUrl}}/products'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Smartphone",
      "sku": "PHONE-123",
      "price": "699.99",
      "quantity": 10,
      "description": "Latest model smartphone with high-end specs",
      "category": "ELECTRONICS"
    }