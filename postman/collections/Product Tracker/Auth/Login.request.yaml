$kind: http-request
name: Login
method: POST
url: '{{baseUrl}}/auth/login'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "password": "secret123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      var json = pm.response.json();
      if (json.access_token) {
        pm.environment.set("authToken", json.access_token);
      }