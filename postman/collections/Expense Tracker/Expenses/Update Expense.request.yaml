$kind: http-request
name: Update Expense
method: PUT
url: '{{baseUrl}}/expenses/{{expense_id}}'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "description": "Dinner",
      "amount": "25.00",
      "category": "FOOD"
    }