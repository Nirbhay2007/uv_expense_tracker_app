$kind: http-request
name: Get Monthly Summary
method: GET
url: '{{baseUrl}}/expenses/monthly-summary'
order: 1400
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
params:
  - key: year
    value: '2026'
    enabled: true
  - key: month
    value: '6'
    enabled: true
