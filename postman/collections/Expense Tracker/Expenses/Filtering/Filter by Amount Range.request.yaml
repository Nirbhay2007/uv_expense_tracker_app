$kind: http-request
name: Filter by Amount Range
method: GET
url: '{{baseUrl}}/expenses'
order: 1020
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
params:
  - key: min_amount
    value: '100'
    enabled: true
  - key: max_amount
    value: '1000'
    enabled: true
