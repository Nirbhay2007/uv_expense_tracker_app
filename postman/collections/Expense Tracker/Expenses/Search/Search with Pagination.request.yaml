$kind: http-request
name: Search with Pagination
method: GET
url: '{{baseUrl}}/expenses'
order: 1080
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
params:
  - key: search
    value: 'uber'
    enabled: true
  - key: page
    value: '1'
    enabled: true
  - key: limit
    value: '5'
    enabled: true
